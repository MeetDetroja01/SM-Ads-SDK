plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.smappsstudio.ads'
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 34

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    
    // Play Services Ads
    implementation 'com.google.android.gms:play-services-ads:23.0.0'
    
    // Gson for JSON parsing
    implementation 'com.google.code.gson:gson:2.10.1'

    // Lifecycle components for App Open Ads
    implementation 'androidx.lifecycle:lifecycle-process:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'

    // Facebook Shimmer
    implementation 'com.facebook.shimmer:shimmer:0.5.0'

    // Google User Messaging Platform (GDPR Consent)
    implementation 'com.google.android.ump:user-messaging-platform:2.2.0'

    // AdMob Mediation Adapters (transitive dependencies for parent apps)
    api 'com.google.ads.mediation:applovin:13.0.1.0'
    api 'com.google.ads.mediation:facebook:6.18.0.0'
    api 'com.google.ads.mediation:mintegral:16.8.61.0'
    api 'com.google.ads.mediation:pangle:6.1.0.9.0'
}
